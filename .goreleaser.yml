version: 2

builds:
  - binary: handrail
    env:
      - CGO_ENABLED=0
    # The three vars main.go declares. Nothing else is injected: handrail has no
    # third-party runtime dependencies to stamp a builder into.
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

# Both names below are what the plugin bootstrap downloads and verifies against
# (spec section 7), so they are a contract with it rather than defaults worth
# re-deriving: the archive template is also the field whose shape changed
# between GoReleaser v1 and v2.
archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# Nobody can read a stripped binary to find out what went into it, and a Go
# binary carries its dependencies rather than resolving them at run time. syft
# writes one SPDX document per archive; the release workflow installs it.
sboms:
  - artifacts: archive

# No `changelog:` block here on purpose. The release body is the changelog
# section, cut by scripts/release-notes.sh and passed with --release-notes,
# which already skips GoReleaser's own commit-list generation. Setting
# `changelog.disable` as well would discard the file too and publish an empty
# release body.

# A tag like v0.1.0-rc.1 must not become the repo's latest release: the default
# is prerelease false, which would publish the pipeline's own proving run as v1.
release:
  prerelease: auto

homebrew_casks:
  - name: handrail
    description: "Cross-harness guardrail manager for agentic coding harnesses"
    homepage: "https://github.com/svyatov/handrail"
    binaries:
      - handrail
    # The tap is public and holds one cask per project, so an rc pushed into it
    # is what every `brew install` gets until the next tag. auto skips the
    # commit whenever the tag carries a prerelease indicator.
    skip_upload: auto
    # Gatekeeper quarantines anything curl'd, and an unsigned binary that dies
    # on first run reads as a broken install rather than a signing decision.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/handrail"]
          end
    repository:
      owner: svyatov
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
