# https://taskfile.dev
#
# The same commands CI runs, so a local pass means what a green check means.
# No Go tool goes in go.mod: a tool directive would put ~200 modules in a go.sum
# whose first promise is zero third-party dependencies, and upstream recommends
# against it for golangci-lint. A Go-team tool runs as `go run pkg@version`
# instead, which checks the download against the checksum database.
version: '3'

vars:
  # CI passes SHORT=-short on the macOS runner, where the cold-start test's 50ms
  # median cannot hold on a shared machine. The test honours the flag, and it
  # execs a separate binary, so skipping it costs no coverage.
  SHORT: ''
  # Below the measured number on purpose: what is left uncovered is OS failure
  # paths whose reachability differs by platform (ADR 0009).
  GATE: 95

tasks:
  default:
    silent: true
    cmds:
      - task --list

  build:
    desc: The release build, so a broken one fails here rather than on a tag
    env:
      CGO_ENABLED: '0'
    cmds:
      - go build -ldflags "-s -w" -o handrail .

  test:
    desc: Race and shuffle, without the coverage instrumentation
    cmds:
      - go test -race -shuffle=on {{.SHORT}} ./...

  cover:
    desc: The full test run, failing under the coverage gate
    cmds:
      - go test -race -shuffle=on {{.SHORT}} -coverpkg=./... -coverprofile=cover.out ./...
      - go tool cover -func=cover.out | tail -1
      - >-
        go tool cover -func=cover.out |
        awk '/^total:/ { gsub(/%/, "", $3); if ($3 + 0 < {{.GATE}}) {
        print "coverage " $3 "% is under the {{.GATE}}% gate"; exit 1 } }'

  lint:
    desc: A tidy and verified go.mod, golangci-lint, the formatter check, the paths the skills quote from the code, the flag tables' source comments, and no em or en dash
    cmds:
      - go mod tidy -diff
      - go mod verify
      - golangci-lint run
      - golangci-lint fmt --diff
      - scripts/check-doc-paths.sh
      - scripts/check-flag-sources.sh
      - scripts/check-dashes.sh

  fuzz:
    desc: Fuzz each parser that reads input handrail did not write, for FUZZTIME each
    vars:
      FUZZTIME: 30s
    cmds:
      # go test fuzzes one target per run. A crashing input lands in the
      # package's testdata/fuzz/, where every later `task test` replays it.
      - go test -run='^$' -fuzz='^FuzzParse$' -fuzztime={{.FUZZTIME}} ./internal/rule
      - go test -run='^$' -fuzz='^FuzzNormalize$' -fuzztime={{.FUZZTIME}} ./internal/harness
      - go test -run='^$' -fuzz='^FuzzRead$' -fuzztime={{.FUZZTIME}} ./internal/shell
      - go test -run='^$' -fuzz='^FuzzPatch$' -fuzztime={{.FUZZTIME}} ./internal/shell
      - go test -run='^$' -fuzz='^FuzzDecoder$' -fuzztime={{.FUZZTIME}} ./internal/gitindex
      - go test -run='^$' -fuzz='^FuzzLink$' -fuzztime={{.FUZZTIME}} ./internal/gitindex

  vuln:
    desc: Known vulnerabilities in the code paths handrail actually calls, in its modules and the standard library
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  release-check:
    desc: Validate .goreleaser.yml, the pinned version, and the changelog section the release body is cut from, so a bad release fails here rather than on a tag
    cmds:
      - goreleaser check
      - scripts/check-version-pin.sh
      # The release body comes from this section, so a missing one is a release
      # with nothing to say. Discard the output: only the exit code matters.
      - scripts/release-notes.sh >/dev/null
