name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every step runs a Taskfile task rather than spelling its command out, so a
# local `task cover` is the same run as the one behind the green check.
jobs:
  test:
    # Both, because handrail's failure paths are the operating system's: a
    # permission denial, a working directory that stops existing, a path that is
    # a directory. The two platforms disagree about several of them.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: ""
          # The cold-start test asserts a 50ms median over 21 process spawns,
          # which a shared macOS runner cannot hold.
          - os: macos-latest
            args: "SHORT=-short"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v2

      - name: Build
        run: task build

      - name: Test and coverage gate
        run: task cover ${{ matrix.args }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # install-only, because the action's own run step would cover half of
      # `task lint` and leave the formatter check to a second spelling of it.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true
      - uses: go-task/setup-task@v2

      - name: Lint and formatting
        run: task lint
