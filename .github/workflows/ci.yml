name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push to the same branch makes the first run's answer worthless, so
# the queued minutes go to the commit somebody is actually waiting on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every step runs a Taskfile task rather than spelling its command out, so a
# local `task cover` is the same run as the one behind the green check.
jobs:
  test:
    # Both, because handrail's failure paths are the operating system's: a
    # permission denial, a working directory that stops existing, a path that is
    # a directory. The two platforms disagree about several of them.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: ""
          # The cold-start test asserts a 50ms median over 21 process spawns,
          # which a shared macOS runner cannot hold.
          - os: macos-latest
            args: "SHORT=-short"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Build
        run: task build

      - name: Test and coverage gate
        run: task cover ${{ matrix.args }}

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # install-only, because the action's own run step would cover half of
      # `task lint` and leave the formatter check to a second spelling of it.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          install-only: true
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Lint and formatting
        run: task lint

  release-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # install-only, so the check runs through the Taskfile like every other
      # step, and `task release-check` locally is the same command.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          install-only: true
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Validate the release config
        run: task release-check
