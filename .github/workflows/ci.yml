name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A vulnerability database entry lands without any commit, so an idle main
  # still gets a weekly govulncheck run to fail on it.
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

# A second push to the same branch makes the first run's answer worthless, so
# the queued minutes go to the commit somebody is actually waiting on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every step runs a mise task rather than spelling its command out, so a local
# `mise run cover` is the same run as the one behind the green check. mise also
# installs the tools at the versions mise.toml pins, the same ones a contributor
# gets from `mise install`.
jobs:
  test:
    # Both, because handrail's failure paths are the operating system's: a
    # permission denial, a working directory that stops existing, a path that is
    # a directory. The two platforms disagree about several of them.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            short: ""
          # The cold-start test asserts a 50ms median over 21 process spawns,
          # which a shared macOS runner cannot hold.
          - os: macos-latest
            short: -short
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11

      - name: Build
        run: mise run build

      - name: Test and coverage gate
        run: mise run cover
        env:
          SHORT: ${{ matrix.short }}

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11

      - name: Lint and formatting
        run: mise run lint

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11

      - name: Fuzz the parsers
        run: mise run fuzz

      # The log names a failing input but does not print it. Commit the file
      # under the same path, and every test run replays it from then on.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failures
          path: internal/*/testdata/fuzz/

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11

      - name: Known vulnerabilities
        run: mise run vuln

  release-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11

      - name: Validate the release config
        run: mise run release-check
