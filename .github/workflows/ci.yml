name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Both, because handrail's failure paths are the operating system's: a
    # permission denial, a working directory that stops existing, a path that is
    # a directory. The two platforms disagree about several of them.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            short: ""
          # The cold-start test asserts a 50ms median over 21 process spawns,
          # which a shared macOS runner cannot hold. The test honours -short, and
          # it execs a separate binary, so skipping it costs no coverage.
          - os: macos-latest
            short: "-short"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The release build, run here so a broken one fails on the pull request
      # rather than on the tag. CGO_ENABLED is scoped to this step: go test -race
      # needs cgo.
      - name: Build
        run: go build -ldflags "-s -w" -o /dev/null .
        env:
          CGO_ENABLED: 0

      - name: Test
        run: go test -race -shuffle=on ${{ matrix.short }} -coverpkg=./... -coverprofile=cover.out ./...

      # The gate sits below the real number on purpose: what is left uncovered
      # is OS failure paths whose reachability differs by platform (ADR 0009).
      - name: Coverage gate
        run: |
          go tool cover -func=cover.out | tail -1
          go tool cover -func=cover.out | awk '/^total:/ {
            gsub(/%/, "", $3)
            if ($3 + 0 < 95) { print "coverage " $3 "% is under the 95% gate"; exit 1 }
          }'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
