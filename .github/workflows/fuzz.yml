name: Fuzz

# The rule and harness targets also use the script fixtures as their seeds.
# Keep both path lists in sync when adding a parser, seed source, or dependency.
on:
  push:
    branches: [main]
    paths:
      - 'internal/rule/**'
      - 'internal/harness/**'
      - 'internal/shell/**'
      - 'internal/gitindex/**'
      - 'testdata/script/**'
      - 'go.mod'
      - 'go.sum'
      - 'mise.toml'
      - '.github/workflows/fuzz.yml'
  pull_request:
    paths:
      - 'internal/rule/**'
      - 'internal/harness/**'
      - 'internal/shell/**'
      - 'internal/gitindex/**'
      - 'testdata/script/**'
      - 'go.mod'
      - 'go.sum'
      - 'mise.toml'
      - '.github/workflows/fuzz.yml'
  workflow_dispatch:
  # New inputs can expose bugs even when the parser code has not changed.
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.14

      - name: Fuzz the parsers
        run: mise run fuzz

      # The log names a failing input but does not print it. Commit the file
      # under the same path, and every test run replays it from then on.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: internal/*/testdata/fuzz/
