version: "2"

# Every linter is on, so one a new golangci-lint release adds starts checking
# without anyone opting in. Only deprecated linters are off, each for the one
# that replaces it. A finding is fixed in the code; a setting below narrows a
# linter only where the fix would be noise or would change what users see.

linters:
  default: all
  disable:
    - exhaustruct # deprecated; exhaustruct_v5 replaces it
    - gomodguard # deprecated; depguard owns the import budget
    - wsl # deprecated; wsl_v5 replaces it

  settings:
    depguard:
      # The runtime dependency budget (ADR 0011) is an allow list rather than a
      # deny list, so a new import fails without anyone remembering to forbid
      # it first. The hook path spawns no process, so os/exec is denied too.
      rules:
        runtime:
          files:
            - "!$test"
          allow:
            - $gostd
            - github.com/svyatov/handrail
            - mvdan.cc/sh/v3/syntax
          deny:
            - pkg: os/exec
              desc: the hook path spawns no process
        test:
          files:
            - $test
          allow:
            - $gostd
            - github.com/svyatov/handrail
            - github.com/rogpeppe/go-internal

    errcheck:
      # Every command writes its report to the stdout and stderr the CLI seam
      # passes in. A write there failing is the shell's business, not a rule
      # decision, and there is nowhere left to report it to anyway.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

    exhaustive:
      # A default branch is the decision that the remaining cases are alike.
      default-signifies-exhaustive: true

    exhaustruct_v5:
      # testscript.Params has fields that are meant to stay zero. A flag table
      # entry sets only the few fields its program uses, a capability row only
      # what its harness can do, and a Repo signal row only the probes it has.
      ignore-patterns:
        - github\.com/rogpeppe/go-internal/.*
        - github\.com/svyatov/handrail/internal/shell\.grammar
        - github\.com/svyatov/handrail/internal/harness\.eventCaps
        - github\.com/svyatov/handrail\.repoSignal

    forbidigo:
      # The CLI seam: run() returns an exit code so every command is callable
      # from a test, and printing goes to the writers it was handed. os.Exit is
      # waived for main.go alone, in the exclusions below.
      forbid:
        - pattern: ^os\.Exit$
          msg: return an exit code from run() instead; os.Exit belongs in main only
        - pattern: ^fmt\.Print(f|ln)?$
          msg: write to the stdout/stderr the CLI seam passes in

    gocritic:
      # unnamedResult: nonamedreturns bans naming, so return a small struct.
      enabled-tags:
        - diagnostic
        - style
        - opinionated

    godox:
      # BUG also matches prose such as "a bug in the installed config".
      keywords:
        - TODO
        - FIXME

    gosec:
      excludes:
        # handrail's whole job is reading and writing config files at paths the
        # user names, so the taint and permission rules fire on the design.
        - G122 # WalkDir callback stats the path it was handed; that is the walk
        - G301 # directory permissions: 0755 on .git/info is git's own mode
        - G302 # file permissions: an existing file's mode is the user's choice
        - G304 # file path from a variable: that variable is the rule path
        - G306 # WriteFile permissions, same reason as G302
        - G703 # path traversal: the path is the repo the user is standing in

    govet:
      enable-all: true
      # Its fix reorders struct fields, which reorders the keys of every
      # --json shape the spec states, and that is what users see.
      disable:
        - fieldalignment

    ireturn:
      # The defaults, plus the node interface the shell parser hands back.
      allow:
        - anon
        - error
        - empty
        - stdlib
        - mvdan.cc/sh/v3/syntax.Node

    nolintlint:
      require-explanation: true
      require-specific: true

    tagliatelle:
      # The --json output is handrail's own published shape, in snake case. The
      # hook responses follow each harness's protocol, which is camel case.
      case:
        rules:
          json: snake
        overrides:
          - pkg: internal/harness
            rules:
              json: camel

    wrapcheck:
      # An error from handrail's own packages already carries its context. An
      # os error names the operation and the path, and the rest are wrapped or
      # printed by their callers, so extra context would only change the text
      # users see.
      ignore-package-globs:
        - github.com/svyatov/handrail/*
        - encoding/json
        - fmt
        - os
        - path/filepath
        - regexp
        - text/tabwriter

    revive:
      # An explicit list: `enable-all-rules` is mostly add-constant and
      # line-length-limit, which is noise, not review.
      rules:
        - name: blank-imports
        - name: bool-literal-in-expr
        # nonamedreturns bans named results, so two results of one type
        # become a small struct.
        - name: confusing-results
        - name: constant-logical-expr
        - name: context-as-argument
        - name: context-keys-type
        - name: datarace
        - name: defer
        - name: dot-imports
        - name: duplicated-imports
        - name: early-return
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: identical-branches
        - name: increment-decrement
        - name: indent-error-flow
        - name: modifies-parameter
        - name: modifies-value-receiver
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: redundant-import-alias
        - name: string-of-int
        - name: struct-tag
        - name: superfluous-else
        - name: time-equal
        - name: time-naming
        - name: unexported-naming
        - name: unexported-return
        - name: unnecessary-stmt
        - name: unreachable-code
        - name: unused-parameter
        - name: use-any
        - name: var-declaration
        - name: var-naming
        - name: waitgroup-by-value

  exclusions:
    presets:
      - std-error-handling
    rules:
      # os.Exit is what main is for. Scoped by text so main.go keeps the
      # fmt.Print rule.
      - path: ^main\.go$
        linters:
          - forbidigo
        text: os\.Exit
      # testscript.Main runs the command in-process and needs the real exit.
      - path: _test\.go$
        linters:
          - forbidigo
        text: os\.Exit
      # The cold-start test execs the binary it just built at a temp path.
      - path: _test\.go$
        linters:
          - gosec
        text: G204
      # A string repeated across table rows is test data, not a constant.
      - path: _test\.go$
        linters:
          - goconst
      # The same in the flag tables: a flag name shared by programs is data.
      # scripts/check-flag-sources.sh finds these tables by their var form.
      - path: ^internal/shell/(files|wrap)\.go$
        linters:
          - goconst
      # Lookup tables the hook path reads on every call, so a function that
      # builds them would allocate them per call; and the two vars GoReleaser
      # sets through -ldflags -X, which reaches only package variables; and
      # ManagedDir, which the tests point into their sandbox.
      - linters:
          - gochecknoglobals
        text: ^(adapters|programs|wrappers|sum|grep|mise|commit|date|ManagedDir) is a global variable
      # These structs' field order is the order of their JSON keys, or, for
      # Failure, embeddedstructfieldcheck pins the embedded field first. The
      # finding is only about where pointer bytes sit, not the struct size.
      - linters:
          - govet
        text: "fieldalignment: (checkRule|checkExamples|checkExample|testOutput|hookOutput|Failure) has"

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/svyatov/handrail
